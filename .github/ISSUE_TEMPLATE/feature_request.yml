name: 功能建议
description: 新能力、体验改进、解析/导出增强
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 场景
      placeholder: 例如：希望按「卷」一键换音色，而不是逐章设置
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 交互草图、参考产品、粗略设计都可以
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: contribute
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意参与实现 / 测试
        - label: 仅建议，暂不参与开发
