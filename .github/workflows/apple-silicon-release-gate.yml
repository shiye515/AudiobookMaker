name: Apple Silicon release gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  arm64-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Run arm64 unit tests
        run: |
          xcodebuild test \
            -project AudiobookMaker.xcodeproj \
            -scheme AudiobookMaker \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:AudiobookMakerTests \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned arm64 archive
        env:
          SKIP_SIGNATURE_CHECK: "1"
        run: |
          Tools/archive-apple-silicon.sh "$RUNNER_TEMP/AudiobookMaker.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
