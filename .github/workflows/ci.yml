name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build Debug
        run: |
          xcodebuild build \
            -project abm.xcodeproj \
            -scheme abm \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci-dd \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: EPUB split fixtures
        run: |
          python3 scripts/make_epub_fixtures.py
          APP="build/ci-dd/Build/Products/Debug/abm.app/Contents/MacOS/abm"
          "$APP" --verify-epub-split scripts/fixtures
