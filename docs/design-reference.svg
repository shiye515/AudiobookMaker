<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AudiobookMaker macOS 界面设计参考图</title>
  <desc id="desc">符合 macOS 设计规范的三栏有声书制作应用界面，包含侧边栏、书籍列表、章节详情、工具栏和任务状态区。</desc>
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe9f7"/>
      <stop offset="0.48" stop-color="#eef2f8"/>
      <stop offset="1" stop-color="#d9e6ed"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f5f8" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#e9edf2" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243e61"/>
      <stop offset="0.55" stop-color="#416b87"/>
      <stop offset="1" stop-color="#d1a56d"/>
    </linearGradient>
    <linearGradient id="cover2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4141"/>
      <stop offset="1" stop-color="#c78a6c"/>
    </linearGradient>
    <linearGradient id="cover3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f5546"/>
      <stop offset="1" stop-color="#95a97a"/>
    </linearGradient>
    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#23384b" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#23384b" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#162b3b" flood-opacity="0.18"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="70" y="55" width="1460" height="890" rx="20"/>
    </clipPath>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; fill: #202124; }
      .display { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; fill: #1d1d1f; }
      .secondary { fill: #6e6e73; }
      .tertiary { fill: #8e8e93; }
      .caption { font-size: 13px; }
      .small { font-size: 12px; }
      .body { font-size: 15px; }
      .headline { font-size: 17px; font-weight: 600; }
      .title2 { font-size: 22px; font-weight: 650; }
      .title1 { font-size: 28px; font-weight: 700; }
      .separator { stroke: #000; stroke-opacity: 0.09; shape-rendering: crispEdges; }
      .symbol { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Desktop backdrop -->
  <rect width="1600" height="1000" fill="url(#desktop)"/>
  <circle cx="132" cy="158" r="280" fill="#c7d9f5" opacity="0.36"/>
  <circle cx="1438" cy="866" r="340" fill="#beddd7" opacity="0.32"/>

  <!-- Main macOS window -->
  <rect x="70" y="55" width="1460" height="890" rx="20" fill="#ffffff" filter="url(#windowShadow)"/>
  <g clip-path="url(#windowClip)">
    <!-- Column surfaces -->
    <rect x="70" y="55" width="220" height="890" fill="url(#sidebar)"/>
    <rect x="290" y="55" width="385" height="890" fill="#f8f8fa"/>
    <rect x="675" y="55" width="855" height="890" fill="#ffffff"/>

    <!-- Toolbar -->
    <rect x="70" y="55" width="1460" height="76" fill="#fafbfd" fill-opacity="0.82"/>
    <line x1="70" y1="131" x2="1530" y2="131" class="separator"/>
    <line x1="290" y1="55" x2="290" y2="945" class="separator"/>
    <line x1="675" y1="55" x2="675" y2="945" class="separator"/>

    <!-- Traffic lights -->
    <circle cx="100" cy="91" r="7" fill="#ff5f57" stroke="#e0443e" stroke-width="0.7"/>
    <circle cx="124" cy="91" r="7" fill="#febc2e" stroke="#dea123" stroke-width="0.7"/>
    <circle cx="148" cy="91" r="7" fill="#28c840" stroke="#1eaa33" stroke-width="0.7"/>

    <!-- Toolbar sidebar toggle -->
    <rect x="238" y="75" width="36" height="32" rx="8" fill="#ffffff" fill-opacity="0.65"/>
    <g transform="translate(247 82)" stroke="#505057" fill="none" stroke-width="1.7">
      <rect x="0" y="0" width="18" height="18" rx="3"/>
      <line x1="6" y1="1" x2="6" y2="17"/>
    </g>

    <!-- Content toolbar title -->
    <text x="314" y="99" class="display headline">书籍</text>

    <!-- Import button -->
    <rect x="708" y="74" width="126" height="36" rx="9" fill="#087aff"/>
    <path d="M727 85v14m-7-7h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="743" y="98" class="ui body" fill="#ffffff" font-weight="600">导入 EPUB</text>

    <!-- Queue button -->
    <rect x="1170" y="75" width="98" height="34" rx="9" fill="#eceef2"/>
    <g transform="translate(1183 85)" fill="none" stroke="#4c4c52" stroke-width="1.7" stroke-linecap="round">
      <line x1="0" y1="2" x2="14" y2="2"/><line x1="0" y1="8" x2="14" y2="8"/><line x1="0" y1="14" x2="10" y2="14"/>
    </g>
    <text x="1207" y="97" class="ui caption">队列 2</text>
    <circle cx="1253" cy="91" r="4" fill="#ff9f0a"/>

    <!-- Search -->
    <rect x="1282" y="75" width="216" height="34" rx="9" fill="#eceef2"/>
    <circle cx="1300" cy="90" r="6" fill="none" stroke="#7c7c82" stroke-width="1.6"/>
    <line x1="1304.5" y1="94.5" x2="1309" y2="99" stroke="#7c7c82" stroke-width="1.6" stroke-linecap="round"/>
    <text x="1318" y="97" class="ui body secondary">搜索书名或作者</text>

    <!-- Sidebar navigation -->
    <text x="92" y="171" class="ui small secondary" font-weight="600" letter-spacing="0.5">资料库</text>
    <rect x="82" y="183" width="196" height="38" rx="8" fill="#087aff" fill-opacity="0.14"/>
    <g transform="translate(99 194)" stroke="#087aff" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 2h6c2 0 3 1 3 3v13c0-2-1-3-3-3H1z"/>
      <path d="M19 2h-6c-2 0-3 1-3 3v13c0-2 1-3 3-3h6z"/>
    </g>
    <text x="130" y="208" class="ui body" fill="#087aff" font-weight="600">书籍</text>
    <text x="258" y="208" class="ui caption" text-anchor="end" fill="#087aff">3</text>

    <g transform="translate(99 237)" stroke="#55565c" fill="none" stroke-width="1.7" stroke-linecap="round">
      <path d="M1 9c4-7 8-7 12 0s8 7 12 0"/>
      <path d="M1 15c4-7 8-7 12 0s8 7 12 0"/>
    </g>
    <text x="130" y="252" class="ui body">模型</text>

    <text x="92" y="316" class="ui small secondary" font-weight="600" letter-spacing="0.5">任务</text>
    <g transform="translate(100 335)" stroke="#55565c" fill="none" stroke-width="1.7" stroke-linecap="round">
      <circle cx="9" cy="9" r="8"/>
      <path d="M9 4v5l4 2"/>
    </g>
    <text x="130" y="350" class="ui body">转换队列</text>
    <rect x="249" y="334" width="26" height="20" rx="10" fill="#ff9f0a"/>
    <text x="262" y="348" class="ui small" fill="#fff" text-anchor="middle" font-weight="600">2</text>

    <!-- Sidebar privacy note -->
    <g transform="translate(95 845)">
      <path d="M9 0c4 2 7 2 7 2v6c0 5-3 8-7 10-4-2-7-5-7-10V2s3 0 7-2z" fill="#30a46c" fill-opacity="0.14" stroke="#27875d" stroke-width="1.2"/>
      <path d="M6 9l2 2 4-5" fill="none" stroke="#27875d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="7" class="ui caption" fill="#397256">全部在本机处理</text>
      <text x="28" y="24" class="ui small secondary">书籍内容不会上传</text>
    </g>

    <!-- Book content column heading and filter -->
    <text x="314" y="169" class="display title2">我的书籍</text>
    <rect x="603" y="147" width="48" height="28" rx="7" fill="#eceef2"/>
    <path d="M617 157h20l-8 8v6l-4 2v-8z" fill="none" stroke="#5c5c62" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Selected book row -->
    <rect x="302" y="188" width="361" height="148" rx="12" fill="#087aff" fill-opacity="0.105"/>
    <rect x="316" y="202" width="72" height="104" rx="5" fill="url(#cover)" filter="url(#smallShadow)"/>
    <circle cx="352" cy="238" r="18" fill="#f5d7a6" opacity="0.83"/>
    <path d="M320 284c20-34 38-25 64-56v78h-64z" fill="#132a43" opacity="0.72"/>
    <text x="352" y="290" class="display small" fill="#fff" text-anchor="middle" font-weight="600">漫长的旅程</text>
    <text x="404" y="224" class="ui headline">漫长的旅程</text>
    <text x="404" y="247" class="ui caption secondary">林知远 · 24 章</text>
    <rect x="404" y="269" width="222" height="5" rx="2.5" fill="#c9ced6"/>
    <rect x="404" y="269" width="93" height="5" rx="2.5" fill="#087aff"/>
    <path d="M405 293l3 3 6-7" fill="none" stroke="#087aff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="421" y="297" class="ui caption" fill="#087aff">正在转换 · 42%</text>
    <text x="645" y="268" class="ui caption secondary" text-anchor="end">10 / 24</text>

    <!-- Other book rows -->
    <rect x="302" y="347" width="361" height="128" rx="11" fill="#fff"/>
    <rect x="316" y="361" width="62" height="90" rx="5" fill="url(#cover2)"/>
    <path d="M321 421c18-20 34-26 52-40v70h-52z" fill="#3c2525" opacity="0.5"/>
    <text x="347" y="440" class="display small" fill="#fff" text-anchor="middle">潮汐以北</text>
    <text x="394" y="384" class="ui headline">潮汐以北</text>
    <text x="394" y="407" class="ui caption secondary">周海 · 18 章</text>
    <rect x="394" y="429" width="232" height="5" rx="2.5" fill="#d4d7dd"/>
    <rect x="394" y="429" width="232" height="5" rx="2.5" fill="#30a46c"/>
    <circle cx="401" cy="449" r="7" fill="#30a46c"/>
    <path d="M397.5 449l2.2 2.2 4.3-4.5" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="416" y="454" class="ui caption" fill="#27875d">已完成</text>
    <line x1="314" y1="475" x2="651" y2="475" class="separator"/>

    <rect x="302" y="476" width="361" height="128" rx="11" fill="#fff"/>
    <rect x="316" y="490" width="62" height="90" rx="5" fill="url(#cover3)"/>
    <circle cx="347" cy="525" r="15" fill="#d8d3ab" opacity="0.75"/>
    <text x="347" y="565" class="display small" fill="#fff" text-anchor="middle">山中来信</text>
    <text x="394" y="513" class="ui headline">山中来信</text>
    <text x="394" y="536" class="ui caption secondary">陈默 · 31 章</text>
    <rect x="394" y="557" width="232" height="5" rx="2.5" fill="#d4d7dd"/>
    <g transform="translate(394 577)">
      <circle cx="7" cy="7" r="6.5" fill="none" stroke="#ff9f0a" stroke-width="1.5"/>
      <line x1="7" y1="3.5" x2="7" y2="7.5" stroke="#ff9f0a" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="7" cy="10.5" r="0.9" fill="#ff9f0a"/>
    </g>
    <text x="414" y="590" class="ui caption" fill="#b16c00">等待开始</text>

    <!-- Detail header -->
    <rect x="709" y="161" width="118" height="170" rx="8" fill="url(#cover)" filter="url(#smallShadow)"/>
    <circle cx="768" cy="215" r="28" fill="#f5d7a6" opacity="0.84"/>
    <path d="M715 294c38-58 67-39 106-98v135H715z" fill="#132a43" opacity="0.72"/>
    <text x="768" y="307" class="display body" fill="#fff" text-anchor="middle" font-weight="650">漫长的旅程</text>

    <text x="859" y="190" class="display title1">漫长的旅程</text>
    <text x="859" y="218" class="ui body secondary">林知远</text>
    <text x="859" y="251" class="ui caption secondary">24 章</text>
    <circle cx="917" cy="247" r="2" fill="#a1a1a6"/>
    <text x="930" y="251" class="ui caption secondary">约 11 小时</text>
    <circle cx="1019" cy="247" r="2" fill="#a1a1a6"/>
    <text x="1032" y="251" class="ui caption secondary">简体中文</text>

    <rect x="859" y="277" width="386" height="7" rx="3.5" fill="#dfe2e7"/>
    <rect x="859" y="277" width="162" height="7" rx="3.5" fill="#087aff"/>
    <text x="859" y="308" class="ui caption" fill="#087aff" font-weight="600">正在转换第 11 章，共 24 章</text>
    <text x="1245" y="308" class="ui caption secondary" text-anchor="end">42%</text>

    <!-- Pause action -->
    <rect x="1267" y="174" width="94" height="36" rx="9" fill="#eceef2"/>
    <rect x="1282" y="184" width="4" height="14" rx="1" fill="#36363b"/>
    <rect x="1290" y="184" width="4" height="14" rx="1" fill="#36363b"/>
    <text x="1304" y="198" class="ui body">暂停</text>
    <rect x="1373" y="174" width="38" height="36" rx="9" fill="#eceef2"/>
    <circle cx="1392" cy="192" r="1.8" fill="#505057"/>
    <circle cx="1385" cy="192" r="1.8" fill="#505057"/>
    <circle cx="1399" cy="192" r="1.8" fill="#505057"/>

    <!-- Runtime info pill -->
    <rect x="859" y="324" width="280" height="32" rx="8" fill="#f2f3f5"/>
    <circle cx="877" cy="340" r="5" fill="#30a46c"/>
    <text x="890" y="345" class="ui caption">Kokoro 多语言 Int8</text>
    <text x="1123" y="345" class="ui small secondary" text-anchor="end">本机运行</text>

    <!-- Chapters section -->
    <text x="709" y="405" class="display title2">章节</text>
    <rect x="1347" y="382" width="64" height="30" rx="8" fill="#f0f1f3"/>
    <text x="1379" y="402" class="ui caption" text-anchor="middle">全部⌄</text>

    <!-- Table header -->
    <rect x="709" y="424" width="702" height="34" rx="8" fill="#f4f5f7"/>
    <text x="729" y="446" class="ui small secondary">章节</text>
    <text x="1226" y="446" class="ui small secondary">时长</text>
    <text x="1321" y="446" class="ui small secondary">状态</text>

    <!-- Chapter rows -->
    <g class="ui body">
      <text x="729" y="490" class="secondary">01</text>
      <text x="772" y="490">启程之前</text>
      <text x="1226" y="490" class="caption secondary">24:18</text>
      <circle cx="1330" cy="484" r="7" fill="#30a46c"/>
      <path d="M1326.5 484l2.2 2.2 4.3-4.5" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1345" y="490" class="caption secondary">已完成</text>
      <line x1="729" y1="509" x2="1391" y2="509" class="separator"/>

      <text x="729" y="541" class="secondary">02</text>
      <text x="772" y="541">穿过雨季</text>
      <text x="1226" y="541" class="caption secondary">31:06</text>
      <circle cx="1330" cy="535" r="7" fill="#30a46c"/>
      <path d="M1326.5 535l2.2 2.2 4.3-4.5" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1345" y="541" class="caption secondary">已完成</text>
      <line x1="729" y1="560" x2="1391" y2="560" class="separator"/>

      <text x="729" y="592" class="secondary">03</text>
      <text x="772" y="592">陌生的港口</text>
      <text x="1226" y="592" class="caption secondary">27:42</text>
      <circle cx="1330" cy="586" r="7" fill="#30a46c"/>
      <path d="M1326.5 586l2.2 2.2 4.3-4.5" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1345" y="592" class="caption secondary">已完成</text>
      <line x1="729" y1="611" x2="1391" y2="611" class="separator"/>

      <rect x="718" y="620" width="684" height="56" rx="8" fill="#087aff" fill-opacity="0.075"/>
      <text x="729" y="654" class="secondary">11</text>
      <text x="772" y="654" font-weight="600">越过群山</text>
      <text x="1226" y="654" class="caption secondary">—</text>
      <circle cx="1330" cy="648" r="8" fill="none" stroke="#087aff" stroke-width="2" stroke-dasharray="12 8"/>
      <text x="1345" y="654" class="caption" fill="#087aff" font-weight="600">转换中</text>
      <line x1="729" y1="679" x2="1391" y2="679" class="separator"/>

      <text x="729" y="718" class="secondary">12</text>
      <text x="772" y="718">夜航</text>
      <text x="1226" y="718" class="caption secondary">—</text>
      <circle cx="1330" cy="712" r="7" fill="none" stroke="#a7a7ad" stroke-width="1.5"/>
      <text x="1345" y="718" class="caption secondary">等待中</text>
      <line x1="729" y1="738" x2="1391" y2="738" class="separator"/>

      <text x="729" y="770" class="secondary">13</text>
      <text x="772" y="770">抵达</text>
      <text x="1226" y="770" class="caption secondary">—</text>
      <circle cx="1330" cy="764" r="7" fill="none" stroke="#a7a7ad" stroke-width="1.5"/>
      <text x="1345" y="770" class="caption secondary">等待中</text>
    </g>

    <!-- Supporting task card -->
    <rect x="709" y="801" width="702" height="73" rx="12" fill="#f5f6f8"/>
    <circle cx="741" cy="837" r="17" fill="#087aff" fill-opacity="0.13"/>
    <path d="M733 839c4-7 7-7 11 0s7 7 11 0" fill="none" stroke="#087aff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="771" y="830" class="ui body" font-weight="600">正在生成语音</text>
    <text x="771" y="852" class="ui caption secondary">第 11 章 · 越过群山 · 已处理 18,420 / 32,800 字</text>
    <text x="1382" y="842" class="ui caption secondary" text-anchor="end">约 6 分钟</text>

    <!-- Bottom status bar -->
    <rect x="290" y="904" width="1240" height="41" fill="#f7f8fa"/>
    <line x1="290" y1="904" x2="1530" y2="904" class="separator"/>
    <circle cx="316" cy="924" r="4.5" fill="#30a46c"/>
    <text x="328" y="929" class="ui caption secondary">运行时已连接</text>
    <line x1="442" y1="915" x2="442" y2="933" class="separator"/>
    <text x="461" y="929" class="ui caption secondary">队列 2</text>
    <line x1="526" y1="915" x2="526" y2="933" class="separator"/>
    <text x="545" y="929" class="ui caption secondary">当前并发 1 / 1</text>
    <line x1="668" y1="915" x2="668" y2="933" class="separator"/>
    <text x="687" y="929" class="ui caption secondary">已完成 1 本 · 28 章</text>
    <text x="1496" y="929" class="ui caption" fill="#087aff" text-anchor="end">查看队列</text>
  </g>

  <!-- Window border -->
  <rect x="70" y="55" width="1460" height="890" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.82"/>
</svg>
